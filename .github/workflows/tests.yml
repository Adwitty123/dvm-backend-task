name: Django tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [task_1_polls, task_2_music]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python ${{ matrix.project }}/manage.py check
      - run: python ${{ matrix.project }}/manage.py migrate --noinput
      - run: python ${{ matrix.project }}/manage.py makemigrations --check --dry-run
      - run: python manage.py test
        working-directory: ${{ matrix.project }}
